<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>

<h3>Multiplication Table</h3>

<input type="text" id="num">
<input type="button" value="Generate Table" onclick="table()">

<p id="result"></p>

<script>

function table()
{
    var n = document.getElementById("num").value;
    var out = "Multiplication Table of " + n + ":<br><br>";

    for(var i=1;i<=10;i++)
    {
        out += n + " x " + i + " = " + (n*i) + "<br>";
    }

    document.getElementById("result").innerHTML = out;
}

</script>

</body>
</html>
